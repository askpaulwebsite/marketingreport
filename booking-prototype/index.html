<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>askpaul Booking, Annotated Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ───────────────────────────────────────────────────────────
   Tokens medidos en produccion (booking.askpaul.ie).
   Nada aqui es invencion: cada valor sale de getComputedStyle.
   ─────────────────────────────────────────────────────────── */
:root{
  --teal:#3BC1CD;          /* cian de marca, intacto */
  --teal-2:#2d99a6;        /* cian oscuro de marca, intacto: bordes y texto grande */
  --teal-text:#136b75;     /* tono derivado para texto a tamano normal (A3): 6.4:1 sobre blanco */
  --ink:#171d35;           /* rgb(23,29,53), texto de produccion */
  --ink-2:#4a5268;
  --ink-3:#767676;         /* gris accesible, sustituye al #d3d3d3 de produccion */
  --line:#e2e6ea;
  --paper:#f2f5f7;         /* fondo de pagina de produccion */
  --card:#ffffff;
  --shadow:rgba(156,167,178,.3) 5px 5px 20px;   /* sombra exacta de produccion */
  --radius:20px;                                 /* radio exacto de produccion */
  --err:#c62828;
  --err-bg:#fdeaea;
  /* capa de anotacion, deliberadamente fuera de la paleta de marca */
  --mk:#C2410C; --mk-bg:#FFF7ED; --mk-line:#FDBA74; --mk-ink:#7C2D12;
  --tec:#475569; --tec-bg:#F1F5F9; --tec-line:#CBD5E1;
  --dec:#6D28D9; --dec-bg:#F5F3FF; --dec-line:#C4B5FD;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);
  font-family:Poppins,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.55}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
:focus-visible{outline:3px solid var(--teal-2);outline-offset:2px}
/* Solo para la demostracion: fuerza el anillo tambien al hacer clic,
   para poder ver con el raton lo que normalmente solo ve el teclado. */
body.focusdemo :focus{outline:3px solid var(--teal-2);outline-offset:2px}
body.focusdemo .demo{background:#dcfce7;border-color:#86efac;color:#166534}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* cabecera de produccion: logo a la izquierda, cuna cian a la derecha */
.brandbar{background:var(--card);padding:16px 26px;display:flex;align-items:center;
  justify-content:space-between;position:relative;overflow:hidden}
/* Fichero de marca real. Se dimensiona por ALTURA para conservar su
   proporcion de 3.72:1; fijar el ancho lo deformaria o lo dejaria minusculo. */
.logo{display:block;height:52px;width:auto;position:relative;z-index:2}
@media(max-width:700px){.logo{height:40px}}
.wedge{position:absolute;top:0;right:0;width:230px;height:100%;
  background:var(--teal);clip-path:polygon(38% 0,100% 0,100% 100%)}

.shell{max-width:1000px;margin:26px auto 60px;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:30px 34px 38px}
@media(max-width:700px){.shell{margin:14px 12px 40px;padding:22px 18px 28px;border-radius:16px}}

/* stepper horizontal de produccion */
.stepper{display:flex;margin:0 0 30px;padding:0;list-style:none}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;
  font-size:12.5px;font-weight:600;color:#6b7280}
/* El circulo mide 33px, asi que su centro cae en 16.5: la linea de 2px va a 15.5. */
.st::before{content:"";position:absolute;top:15.5px;left:-50%;width:100%;height:2px;background:var(--line)}
.st:first-child::before{display:none}
.st.done::before{background:var(--teal-2)}
.st .dot{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;z-index:1;
  background:var(--card);border:2px solid var(--line);font-size:13px;font-weight:700}
.st[aria-current="step"]{color:var(--ink)}
.st[aria-current="step"] .dot{background:var(--teal);border-color:var(--teal);color:var(--ink)}
.st.done{color:var(--teal-text)}
.st.done .dot{background:var(--teal-2);border-color:var(--teal-2);color:#fff}

h1.ph{font-size:23px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.psub{color:var(--ink-2);font-size:13.5px;margin:0 0 24px;max-width:66ch}
/* El subtitulo de la seleccion es una frase sola: sin el tope de 66ch cabe en
   una linea en escritorio y sigue plegandose por si misma en pantallas estrechas. */
.psub.wide{max-width:none}

/* tarjetas de servicio: blanco, radio 20, sombra de produccion */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
.cardwrap{position:relative;display:flex}
.cardwrap>.svc{flex:1}
.svc{text-align:center;cursor:pointer;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:22px 16px 20px;display:flex;flex-direction:column;
  align-items:center;gap:12px;color:var(--ink);box-shadow:var(--shadow);
  transition:transform .16s,box-shadow .16s,border-color .16s}
/* M18: el hover de produccion se conserva tal cual (fondo #45BDCD).
   Lo unico que cambia es la tinta encima: blanco daba 2.23:1, #171d35 da 7.45:1. */
.svc:hover{background:#45BDCD;border-color:#45BDCD;color:var(--ink);
  box-shadow:rgba(45,153,166,.34) 5px 8px 24px}
.svc:hover .ic{color:var(--ink)}
.svc:hover .meta{color:var(--ink)}
.svc:hover .now,.svc:hover .was,.svc:hover .dur{color:var(--ink)}
.svc .ic{display:grid;place-items:center;color:var(--teal-2)}
.svc .ic svg{width:56px;height:56px;display:block}
.svc .nm{font-weight:700;font-size:15px;line-height:1.35}
/* El precio no son tres datos iguales: es una transformacion (lo que valia ->
   lo que cuesta) mas un calificador. La jerarquia lo dice sin palabras. */
.svc .meta{display:flex;flex-direction:column;gap:1px;align-items:center;color:var(--ink-2)}
.svc .price{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.15}
.was{text-decoration:line-through;color:#6b7280;font-size:12px}        /* 4.83:1 */
.now{font-size:19px;font-weight:800;letter-spacing:-.01em;color:#136b75}/* 6.2:1  */
.now.paid{color:#8a5200}                                               /* 6.39:1 */
.dur{font-size:11px;color:#5f6875;letter-spacing:.02em;margin-top:2px} /* 5.64:1 */
/* Produccion mantiene DOS columnas hasta 360px (medido: 2-2-2-1, tarjeta de
   156px). El prototipo caia a una sola por debajo de 520px, asi que se alinea
   y se aprieta el interior de la tarjeta para que quepa sin encogerla. */
@media(max-width:520px){
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  /* El icono se queda encima del nombre, como en escritorio, pero a tamano de
     lista: en una tarjeta de 150px una ilustracion de 56px se comia la mitad
     del alto sin aportar mas de lo que aporta a 26px. Todo centrado. */
  .svc{padding:16px 11px 14px;gap:8px}
  .svc .ic svg{width:26px;height:26px}
  .svc .nm{font-size:13px;line-height:1.28}
  .now{font-size:17px}
  .was{font-size:11.5px}
  .dur{font-size:10.5px}
  /* En una tarjeta de 150px los marcadores de anotacion se comen el texto:
     se encogen y la tarjeta reserva aire arriba y abajo para alojarlos. */
  .grid .mk{min-width:21px;height:21px;font-size:9px;border-width:1.5px}
  .grid .svc{padding-top:26px;padding-bottom:26px}
}
/* Por debajo de 400px la tarjeta es de 144px y la primera lleva siete
   marcadores: los de la fila inferior salen al borde para no tapar el precio. */
/* Con la tarjeta a 150px los marcadores no caben en las esquinas sin morder el
   texto. Se encogen, se pegan al borde y el contenido reserva el aire que ocupan. */
@media(max-width:520px){
  .grid .svc{padding:24px 12px 24px}
  .grid .mk[style*="right:8px"]{right:3px!important}
  .grid .mk[style*="left:8px"]{left:3px!important}
  .grid .mk[style*="bottom:8px"]{bottom:3px!important}
  .grid .mk[style*="top:8px"]{top:3px!important}
  .grid .mk[style*="top:66px"]{top:44px!important;left:3px!important}
  .grid .mk[style*="top:36px"]{top:26px!important;right:3px!important}
  .grid .mk[style*="bottom:42px"]{bottom:3px!important;right:30px!important}
}
.tag{font-weight:700;font-size:11px;padding:3px 10px;border-radius:999px;letter-spacing:.04em;
  background:#eef7f8;color:#136b75}
.tag.paid{background:#fff0cc;color:#8a5200}
.was{text-decoration:line-through;color:#6b7280}
.existing-sep{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin:6px 0 -6px}
.existing-sep hr{flex:1;border:none;border-top:1px solid var(--line);margin:0}
.existing-sep span{font-size:12px;font-weight:600;color:var(--ink-2)}

/* detalle */
.phsvc .micon{display:none}
.detail{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start}
@media(max-width:640px){.detail{grid-template-columns:1fr}}
.detail .big{display:grid;place-items:center;color:var(--teal-2)}
.detail .big svg{width:88px;height:88px;display:block}
.facts{border:1px solid var(--teal-2);border-radius:14px;padding:15px 18px;margin:0 0 18px;background:#f4fcfd}
.facts dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13.5px}
.facts dt{color:var(--ink-2)}
.facts dd{margin:0;font-weight:600}
ul.benefits{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:14px}
ul.benefits li{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start}
/* tick suelto en #2d99a6: 3.38:1 sobre la tarjeta blanca, por encima del
   umbral de 3:1 para graficos. Con el cian de marca seria 2.17:1 (ver A3). */
.tk{width:17px;height:17px;display:grid;place-items:center;margin-top:2px}
.tk svg{width:17px;height:17px;color:var(--teal-2);display:block}

/* ingresos */
/* Una sola columna, como produccion. Los tramos son una escala ordinal:
   en varias columnas el orden se parte y ademas cambia con el ancho de la ventana. */
.bands{display:grid;grid-template-columns:1fr;gap:0;max-width:240px}
.band{display:flex;align-items:center;gap:4px;border:none;background:none;padding:0;
  cursor:pointer;text-align:left;color:var(--ink)}
/* Casilla y pildora reproducidas de produccion: 46x46 y 178x34, radio 5px,
   relleno #3BC1CD. Lo unico que cambia es el color del texto (cambio 20, A3):
   blanco encima daba 2.17:1, #171d35 da 7.67:1. */
.band .box{width:46px;height:46px;display:grid;place-items:center;flex:none;color:var(--teal)}
.band .box svg{width:24px;height:24px;display:block}
/* A21: en produccion las siete pildoras van rellenas de teal siempre, elegidas o no,
   asi que el relleno no puede significar "elegido". Aqui sin elegir es contorno
   (#2d99a6, 3.38:1) y elegido es relleno (#3BC1CD con #171d35, 7.67:1). */
.band .pill{width:178px;height:34px;border-radius:5px;background:var(--card);
  border:1.5px solid var(--teal-2);color:var(--ink);
  display:grid;place-items:center;font-size:16px;line-height:1}
.band[aria-checked="true"] .pill{background:var(--teal);border-color:var(--teal);font-weight:600}
/* Si y No no necesitan pildora: la casilla ya dice cual esta elegido. En las
   bandas de ingresos si la necesita, porque alli es la senal de seleccion
   (nota 16b), asi que el cambio va acotado a esta pregunta. */
.band.plain{gap:2px;margin-right:18px}
.band.plain .pill{width:auto;height:auto;border:none;background:none;padding:0 2px;
  font-size:15px;place-items:center start}
.band.plain[aria-checked="true"] .pill{background:none;font-weight:700;color:var(--ink)}
/* Produccion no cambia nada al pasar el raton por un tramo: medido en reposo
   y con el raton encima, identico, cursor pointer en ambos. No se anade hover. */

/* calendario */
.cal2{display:grid;grid-template-columns:minmax(0,310px) minmax(0,1fr);gap:30px}
@media(max-width:820px){.cal2{grid-template-columns:1fr}}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:700;font-size:14.5px}
.calnav{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);
  cursor:pointer;color:var(--ink);font-size:17px;display:grid;place-items:center;flex:none}
.calnav:disabled{color:#6b7280;cursor:not-allowed}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:26px}
.dw{font-size:10.5px;font-weight:700;color:#6b7280;text-align:center;padding-bottom:6px}
/* Circulo de 36x36, como produccion (border-radius 50%, medido).
   Solo en tactil sube a 44 para cumplir el cambio 28. */
.day{width:36px;height:36px;margin:0 auto;border-radius:50%;border:1.5px solid transparent;
  background:transparent;color:var(--ink);cursor:pointer;font-size:13.5px;font-weight:600;
  display:grid;place-items:center;position:relative}
/* Siete dias de 44px mas 6 huecos de 4px piden 332px y a 360px solo hay 319:
   el ancho cede y el alto no, que es el eje donde se falla el toque. */
@media (pointer:coarse),(max-width:768px){
  .day{width:100%;max-width:44px;height:44px}
  .days{gap:2px}
  .calnav{width:44px;height:44px}
  .demo{min-height:44px}
}
.day:hover:not(:disabled){border-color:var(--teal)}
.day[aria-pressed="true"]{background:var(--teal);color:var(--ink);font-weight:700}
.day:disabled{color:var(--ink-3);text-decoration:line-through;cursor:not-allowed;font-weight:400}
.day.today{box-shadow:inset 0 0 0 2px var(--teal-2)}
/* Tres por fila, como produccion: medido, y=425 lleva 16:00, 17:00 y 18:00,
   y=503 lleva 19:00. Chip de 122x58. */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:404px}
.slot{min-height:44px;border-radius:12px;border:2px solid var(--teal-2);background:var(--card);
  color:var(--teal-text);font-weight:500;font-size:15px;cursor:pointer}
/* :not() dos veces gana en especificidad al estado elegido, asi que hay que
   excluirlo explicitamente o el hover borra el relleno del chip seleccionado. */
.slot:hover:not(:disabled):not([aria-pressed="true"]){background:#eef7f8}
/* El canal que no es color es el peso, no un tick pegado a la hora: un tick
   cambia el ancho de la etiqueta y descoloca la hora respecto a la fila de arriba. */
.slot[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--ink);font-weight:700}
.slot:disabled{border-color:#b7bdc8;color:var(--ink-3);text-decoration:line-through;font-weight:400;cursor:not-allowed}
.tz{font-size:13px;color:var(--ink-2);margin:0 0 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* Contexto pequeno arriba, lo que acaba de cambiar grande debajo. Produccion
   mete ambos en una frase de tres lineas que empieza narrando la pantalla y
   deja la fecha al final; aqui la fecha manda porque es lo que hay que
   verificar tras el toque. */
.bkline{margin:0 0 3px;font-size:12px;color:var(--ink-2);letter-spacing:.01em;position:relative}
.dayline{margin:0 0 14px;font-size:16px;font-weight:700;color:var(--ink);line-height:1.25}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--ink-2);font-size:13.5px}
/* Esqueleto de las doce horas en lugar de un indicador generico: dice que
   viene y donde. La animacion la anula la regla de prefers-reduced-motion. */
.skel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:404px}
.skel span{height:44px;border-radius:12px;background:#eef1f4;
  background-image:linear-gradient(90deg,#eef1f4 25%,#e1e6eb 37%,#eef1f4 63%);
  background-size:400% 100%;animation:sk 1.3s ease infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.demos{display:flex;gap:9px;flex-wrap:wrap}
/* Tarjeta fantasma con la forma de la real: dice cuantas vienen y donde. */
.skelcard{border-radius:var(--radius);min-height:254px;background:#eef1f4;
  background-image:linear-gradient(90deg,#eef1f4 25%,#e1e6eb 37%,#eef1f4 63%);
  background-size:400% 100%;animation:sk 1.3s ease infinite}
@media(max-width:520px){.skelcard{min-height:162px}}
.errax{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
/* Sobre el rosa del panel el relleno de marca solo llega a 2.31:1, por debajo
   del 3:1 que pide 1.4.11 para el contorno de un control. El borde en teal
   oscuro lo define (5.36:1) sin cambiarle el color al boton. */
.errax .btn{height:44px;border:1.5px solid var(--teal-text)}
/* Secundaria de verdad: enlace, no boton. Sube a 13.5 y semibold para que no
   se lea como texto suelto al lado de una accion rellena. */
.lnk{background:none;border:none;padding:4px 2px;color:var(--teal-text);text-decoration:underline;
  cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit;min-height:44px}
.apierr{border:1.5px solid var(--err);background:var(--err-bg);border-radius:12px;padding:16px 18px;font-size:13.5px}
.apierr b{display:block;margin-bottom:4px;color:#8f1f1f}

/* formulario */
.hold{display:flex;align-items:center;gap:13px;flex-wrap:wrap;background:#eef7f8;border:1px solid var(--teal-2);
  border-radius:12px;padding:11px 16px;margin:0 0 20px;font-size:13.5px}
.hold.warn{background:#fff4e5;border-color:#d97706}
.hold b{font-variant-numeric:tabular-nums}
.hold .hicon{width:16px;height:16px;flex:none;vertical-align:-3px;margin-right:7px;color:var(--teal-2)}
.hold.warn .hicon{color:#b45309}
.hold .ext{font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--teal-2);background:var(--card);color:var(--teal-text)}
/* Rejilla de 12 como el MuiGrid de produccion. Los tramos salen del bundle:
   firstName md=6, lastName md=6, dateOfBirth md=4, occupation md=4,
   mobilePhoneNo md=4 (md=6 en Existing Clients), el resto md=12.
   Eso da 2, 3, 1, 1, 1 y no 2, 2, 2 como yo lo tenia. */
.frm{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.f{grid-column:span 12}
.f.c6{grid-column:span 6}
.f.c4{grid-column:span 4}
@media(max-width:700px){.f,.f.c6,.f.c4{grid-column:span 12}}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:13.5px;font-weight:600}
.req{color:var(--err)}
.hint{font-size:12px;color:#6b7280}
/* Bandera dibujada en SVG, no emoji: Windows no renderiza los emoji de
   bandera y saldria "IE". pointer-events:none la hace no pulsable, y ademas
   un clic sobre ella cae en el campo que tiene debajo. */
/* Plantilla DD/MM/YYYY siempre visible. Va encima del campo con
   pointer-events:none; la parte ya tecleada se pinta transparente para
   ocupar el mismo ancho y dejar ver el texto real de debajo. */
.withmask{position:relative;display:block}
.withmask .ghost{position:absolute;inset:0;display:flex;align-items:center;
  padding:0 14px;font:inherit;font-size:16px;letter-spacing:normal;
  color:#6b7280;pointer-events:none;white-space:pre;user-select:none}  /* 4.83:1 */
.withmask .ghost i{color:transparent;font-style:normal}
.withmask .in{width:100%;background:transparent}
/* Ambar, no rojo: es una explicacion, no un error. Nada que corregir. */
.note{font-size:12.5px;color:#8a5200;background:#fff7e6;border:1px solid #f0c987;
  border-radius:8px;padding:5px 9px;margin-top:2px;display:block}
.note[hidden]{display:none}
.withflag{position:relative;display:flex;align-items:center}
.withflag .flag{position:absolute;left:13px;width:22px;height:15px;border-radius:2px;
  pointer-events:none;box-shadow:0 0 0 1px rgba(23,29,53,.14)}
.withflag .in{padding-left:45px;width:100%}
.in{font-size:16px;font-family:inherit;height:52px;padding:0 14px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
textarea.in{height:auto;min-height:96px;padding:13px 14px;resize:vertical;line-height:1.5}
.in[aria-invalid="true"]{border-color:var(--err);background:var(--err-bg)}
/* 13.5px alineado a la izquierda, junto al campo: produccion lo pone
   a 10px y alineado a la derecha por debajo de 600px (ver nota 45). */
.err{font-size:13.5px;color:#a81c1c;font-weight:600;display:flex;gap:5px}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:13px;grid-column:span 12;line-height:1.55;
  cursor:pointer;color:var(--ink-2)}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--teal-2);flex:none}
.acts{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
/* Radio 15px, alto 47px y el degradado de produccion (fairstone: 270deg,
   #3BC1CD -> #33ADBC). El ancho no se fija en 125px porque el cambio 48
   alarga la etiqueta del ultimo boton. Solo cambia la tinta, cambio 47. */
.btn{font-size:16px;font-weight:600;height:47px;padding:0 26px;border-radius:15px;border:none;
  background:linear-gradient(270deg,#3BC1CD 0%,#33ADBC 100%);color:var(--ink);cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.1)}
.btn:hover:not(:disabled){background:linear-gradient(270deg,#33ADBC 0%,#2d99a6 100%);color:var(--ink)}
.btn:disabled{background:#e6eaee;color:#5c6470;cursor:not-allowed;box-shadow:none}
.btn.sec{background:transparent;border:1.5px solid var(--line);color:var(--ink-2);font-weight:600;box-shadow:none}
.btn.sec:hover{border-color:#6b7280;color:var(--ink);background:transparent}
.btn.busy{color:transparent;position:relative}
.btn.busy::after{content:"";position:absolute;inset:0;margin:auto;width:19px;height:19px;border-radius:50%;
  border:2.5px solid rgba(23,29,53,.25);border-top-color:var(--ink);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* confirmacion. La clase se llama .okpanel y no .done: el stepper ya usa
   .done para el paso completado, y un selector .done sin acotar le metia
   8px de relleno superior que descolocaba los circulos en todos los anchos. */
.okpanel{text-align:center;padding:8px 0 2px}
.okpanel .tick{width:62px;height:62px;border-radius:50%;background:var(--teal);display:grid;place-items:center;
  margin:0 auto 16px;font-size:29px;color:var(--ink)}
.doneacts{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.urlline{text-align:center;font-size:12.5px;color:var(--ink-2);margin-top:20px}
.maillink{display:block;margin:20px auto 0;background:none;border:none;color:var(--teal-text);
  text-decoration:underline;cursor:pointer;font-size:13px}

/* correo */
.mail{border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:580px;margin:0 auto}
.mailhead{background:#f7f9fa;padding:13px 17px;border-bottom:1px solid var(--line);font-size:12.5px}
.mailhead div{display:flex;gap:9px;margin-bottom:3px}
.mailhead span:first-child{color:#5f6875;min-width:52px}
.mailbody{padding:21px 19px;font-size:13.5px}
.join{border:1.5px solid var(--teal-2);border-radius:12px;padding:15px;margin:16px 0;background:#eef7f8}
.joinb{display:inline-block;background:var(--teal);color:var(--ink);font-weight:700;padding:11px 24px;
  border-radius:999px;text-decoration:none;margin-top:10px}

/* trustpilot del pie, tal cual en produccion */
.tp{max-width:1000px;margin:0 auto 50px;padding:16px 34px;display:flex;align-items:center;gap:14px;
  font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.tp .stars{display:flex;gap:2px}
.tp .stars i{width:19px;height:19px;background:#00b67a;display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px}

/* ───── capa de anotacion ───── */
.an{position:relative}
.mk{position:absolute;z-index:40;min-width:26px;height:26px;padding:0 5px;border-radius:999px;
  background:var(--mk);color:#fff;border:2px solid var(--card);font-family:"IBM Plex Mono",monospace;
  font-size:10px;font-weight:500;cursor:pointer;display:grid;place-items:center;line-height:1;
  box-shadow:0 1px 5px rgba(0,0,0,.3)}
.mk:hover{transform:scale(1.15)}
body.clean .mk{display:none}
.bub{position:absolute;z-index:80;width:292px;background:var(--mk-bg);border:1.5px solid var(--mk-line);
  border-left:4px solid var(--mk);border-radius:12px;padding:13px 15px;box-shadow:0 10px 30px rgba(23,29,53,.22)}
.bub::before{content:"";position:absolute;width:11px;height:11px;background:var(--mk-bg);
  border-left:1.5px solid var(--mk-line);border-bottom:1.5px solid var(--mk-line);
  transform:rotate(45deg);top:15px;left:-7px}
.bub.below::before{top:-7px;left:20px;transform:rotate(135deg)}
.bub.flip::before{left:auto;right:-7px;transform:rotate(225deg)}
.bub .bt{margin:0 0 6px;padding-right:20px;font-size:12.5px;font-weight:700;color:var(--mk-ink);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.bub p{margin:0;font-size:12.5px;color:#44403c;line-height:1.5}
.bub code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:rgba(194,65,12,.11);
  padding:1px 5px;border-radius:4px;color:var(--mk-ink);word-break:break-word}
.bub .x{position:absolute;top:6px;right:8px;border:none;background:none;cursor:pointer;font-size:16px;color:var(--mk-ink);padding:2px 5px}
.demo{margin-top:14px;background:var(--tec-bg);border:1px dashed var(--tec-line);color:var(--tec);
  font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;
  font-family:"IBM Plex Mono",monospace}
body.clean .demo{display:none}
.trace{max-width:1000px;margin:0 auto 40px;padding:14px 18px;background:var(--tec-bg);
  border:1px dashed var(--tec-line);border-radius:12px;font-size:11.5px;color:#334155;
  font-family:"IBM Plex Mono",monospace;display:grid;gap:5px}
.trace b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#475569}
.trace code{word-break:break-all;line-height:1.5}
body.clean .trace{display:none}
.fab{position:fixed;right:20px;bottom:20px;z-index:95;background:var(--mk);color:#fff;border:none;
  border-radius:999px;padding:12px 19px;font-size:12.5px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 18px rgba(23,29,53,.25)}
body.clean .fab{background:var(--card);color:var(--ink-2);border:1.5px solid var(--line)}

/* gestion de la cita (appointmentManage). Sin componentes nuevos: .facts y
   .acts son los de la confirmacion. Solo el bloque de aviso es nuevo. */
.notice{border:1.5px solid var(--line);background:#f7f9fa;border-radius:14px;
  padding:16px 18px;margin:0 0 18px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.notice b{display:block;margin-bottom:6px;font-size:15px;color:var(--ink)}
.notice.warn{border-color:#e0b34a;background:#fdf8ec}
.notice.bad{border-color:#d09595;background:#fdf4f4}
/* 620 y no 560: la etiqueta del boton nombra la cita (cambio 55) y a 560
   se parte en dos filas, que es un salto de linea accidental, no una decision. */
.mgwrap{max-width:620px;margin:0 auto}
.mgwrap .acts{justify-content:center}
.mgreason{width:100%;font-family:inherit;font-size:16px;padding:11px 13px;border-radius:15px;
  border:2px solid #9ca7b2;background:var(--card);color:var(--ink);resize:vertical;min-height:88px}
.mgreason:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.mgfoot{max-width:1000px;margin:0 auto 46px;padding:0 34px;text-align:center;
  font-size:12px;color:var(--ink-2);line-height:1.6}
/* :not(.mk) o la regla se comeria el color del marcador de nota */
.mgfoot button:not(.mk){background:none;border:none;color:var(--teal-text);text-decoration:underline;
  cursor:pointer;font-size:12px;font-family:inherit;padding:2px}
.mgstates{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.mgstates .demo{margin-top:0}
body.clean .mgstates{display:none}
/* ═══════════════════════════════════════════════════════════
   Selector de tamano de vista.
   Las 8 media queries del prototipo miden el VIEWPORT, no el
   contenedor, asi que meter la app en un div estrecho no las
   dispara: saldria el layout de escritorio encogido, que es
   justo lo que no se quiere ver. La vista movil es un iframe,
   que tiene viewport propio y evalua las queries de verdad.
   ═══════════════════════════════════════════════════════════ */
/* Va al pie de la pagina: la linea separadora arriba, no abajo. */
.vbar{display:flex;justify-content:center;padding:15px 16px 20px;background:var(--card);
  border-top:1px solid var(--line)}
.vseg{display:inline-flex;background:var(--paper);border:1px solid var(--line);
  border-radius:12px;padding:3px;gap:3px}
.vt{font:600 13.5px Poppins,system-ui,sans-serif;color:var(--ink-2);background:transparent;
  border:none;border-radius:9px;padding:0 19px;min-height:38px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px}
.vt:hover{color:var(--ink)}
.vt[aria-checked="true"]{background:var(--card);color:var(--teal-text);
  box-shadow:0 1px 3px rgba(20,28,46,.16)}
.vt svg{width:15px;height:15px;flex:none}
.vstage{display:none;padding:26px 16px 30px;background:var(--paper)}
body.mobmode .vstage{display:block}
body.mobmode>.brandbar,body.mobmode>.shell,body.mobmode>footer,
body.mobmode>#traceHost,body.mobmode>.fab{display:none}
.phone{width:414px;margin:0 auto;background:#1b2030;border-radius:42px;padding:12px;
  box-shadow:0 18px 44px rgba(20,28,46,.24);transform-origin:top center}
/* 844 fijo. Recortarlo cambiaria el viewport del marco y la vista previa
   mentiria justo sobre donde cae el pliegue, que es lo que se viene a mirar. */
.phscr{display:block;width:390px;height:844px;border:0;
  border-radius:31px;background:var(--card)}
.phcap{text-align:center;margin:15px auto 0;max-width:430px;font-size:12px;
  line-height:1.5;color:var(--ink-2)}
/* Dentro del iframe la barra sobra: ya se eligio fuera. */
body.framed .vbar,body.framed .vstage{display:none}
/* En un movil de verdad no se simula un movil: el marco se retira. */
@media(max-width:520px){
  .vstage{padding:0 0 22px}
  .phone{width:100%;border-radius:0;padding:0;box-shadow:none;background:transparent;
    transform:none!important;margin-bottom:0!important}
  .phscr{width:100%;height:calc(100vh - 120px);border-radius:0;
    border-top:1px solid var(--line)}
  /* En un movil de verdad el marco se retira y el iframe toma el ancho real
     del aparato, asi que el pie afirmaria un tamano que no es el que se ve. */
  .phcap{display:none}
  .vt{padding:0 15px}
}
/* Estos dos ajustes moviles van al final a proposito: sobrescriben reglas base
   (.acts, .detail .big) declaradas mas abajo que el primer bloque @media, y
   colocados alli perdian la cascada. */
@media(max-width:520px){
  /* Paso 1: el icono grande sale del bloque y entra pequeno junto al nombre. */
  .phsvc{display:flex;align-items:center;gap:10px}
  .phsvc .micon{display:block;flex:none;color:var(--teal-2)}
  .phsvc .micon svg{width:30px;height:30px;display:block}
  .detail .big{display:none}
  /* Los dos botones de cierre caben en una linea quitandoles holgura lateral.
     El texto del boton no se acorta: lo fija el cambio 33. Se conserva el
     flex-wrap:wrap de base: forzar nowrap metia en una linea los botones
     largos de la pantalla de gestion y desbordaba la pagina 30px. */
  .acts{gap:10px}
  .acts .btn{padding:0 13px;flex:0 1 auto;min-width:0;white-space:nowrap}
}
@media(max-width:360px){
  .acts{gap:8px}
  .acts .btn{padding:0 9px;font-size:15px}
}
/* A 320px la pareja del paso 4 no entra ni con la holgura al minimo: un punto
   menos de tipografia la mete sin tocar el texto del boton. */
@media(max-width:330px){
  .acts .btn{font-size:14px;padding:0 8px}
}
/* Back y Next son etiquetas cortas y dejaban una fila casi vacia: se les da
   cuerpo. Solo en las filas que llevan las dos, no en la del paso 4, donde el
   segundo boton nombra la accion y ya ocupa lo suyo. */
@media(min-width:521px){
  .acts.nav .btn{min-width:170px}
}
@media(max-width:520px){
  /* Comparten la fila, con tope para que el salto al pasar a escritorio (170)
     no se note y para que en tableta no queden desproporcionados. */
  .acts.nav .btn{flex:1 1 auto;max-width:200px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const N={
 "3":["Card is a real button","The card is now a <code>&lt;button type=\"button\"&gt;</code> instead of a <code>&lt;div&gt;</code> with an onclick handler."],
 "6":["The hover is kept, its contrast is fixed","Production's teal hover stays exactly as it is. The label, the meta line and the icon switch to charcoal instead of white."],
 "7a":["Visible focus ring","A 3px outline in brand teal marks whichever element the keyboard is on, with 2px of separation so it does not sit flush against the border. One rule covers every interactive element in the flow."],
 "8":["The screen has an h1","Each step opens with a real heading."],
 "2":["No orphaned card","Existing Clients sits under its own separator, <i>Already a client?</i>, and returns to the normal left column edge instead of floating centred."],
 "11":["FREE without quote marks","The price reads FREE, not \"FREE\"."],
 "4":["The €400 price is on the card","Business Owner shows its price from the first screen."],
 "10":["Duration and the price it replaces, on the card","Every card states one hour and, where there is one, the price the consultation used to carry, struck through before the word FREE."],
 "9":["Logo has alt text","The logo carries a text alternative and its link has an accessible name."],
 "5":["Trustpilot out of the tab order","The review widget no longer sits between the user and the task."],
 "14":["Benefits are a real list","The benefit lines sit inside a <code>&lt;ul&gt;</code>."],
 "12":["Price, duration, format and cancellation together","The four facts someone needs before committing, in one block."],
 "13":["Every service gets real copy","All seven have four substantive benefit lines."],
 "15":["Says why the question is asked","One line explains what the answer is used for."],
 "17":["Consistent capitalisation","All bands use the same casing."],
 "16a":["Dark text on the teal","The band labels use charcoal text on the brand teal rather than white."],
 "16b":["Unselected bands must not look selected","Without a choice the band is an outline. Chosen, it fills with the brand teal and the label goes semibold. The tick in the square stays as the second signal."],
 "18a":["Slot state comes from the API","Each chip's <code>disabled</code> is driven by the <code>isAvailable</code> flag the API already returns."],
 "18c":["The wait has an end, whatever the server does","A skeleton of the twelve times, not a spinner, and a deadline of its own. If the request fails you get a message and a way forward; if it never answers at all the deadline still fires, because a request that hangs never reaches the code that would switch the indicator off."],
 "18b":["A second channel that is not colour","Unavailable times are struck through. The chosen one fills and its label goes bold. Three states, three treatments, none of them relying on hue."],
 "21":["aria-pressed on the chip","The chosen time is exposed programmatically, and each chip is named with its date."],
 "19":["Days without capacity are disabled","Days with no slots carry <code>disabled</code> and cannot be clicked."],
 "20":["Unavailable days readable","The disabled grey is raised to 4.5:1 and unavailable days are struck through. No dot on the available ones: see note W3."],
 "22":["44px touch targets","Days, time chips, the month arrows and Back/Next are all at least 44px high on touch viewports."],
 "7b":["Focus visible on days and chips","Keyboard focus is visible throughout the calendar."],
 "39":["Real labels","Every field has a <code>&lt;label for&gt;</code> bound to its input."],
 "40":["required and aria-required","Mandatory fields are marked in the DOM, not only with a visual asterisk."],
 "30":["Correct autocomplete tokens","Each field declares the right token, so the browser fills the form in one action."],
 "29":["16px on every field","Every field is at least 16px on touch viewports. The reason given for it in earlier versions of this note was wrong."],
 "37":["One field height","Every single-line field is 52px, and the input fills its own box instead of spilling out of it."],
 "24":["Irish numbers, and a flag that stops lying","Irish numbers only, at your instruction. Every Irish number is accepted, and the flag is a static marker that never changes, because there is nothing for it to change to."],
 "34":["Date of birth: numbers only, and the slashes write themselves","Typing <code>15</code> gives you <code>15/</code> at once. Letters and symbols are ignored. The format sits under the field as permanent helper text, and the keypad is numeric."],
 "25b":["The countdown does not start again when you step back","The remaining time belongs to the appointment, not to the screen. Going back to look at other times and returning resumes the same countdown; only choosing a different date or time starts a new one, and asking for longer still gives a fresh five minutes."],
 "25a":["The hold warns and can be extended","Five minutes, production's own. For the first four the strip only tells you the time is held. At sixty seconds it turns amber and the control to extend appears, and each press buys another five."],
 "23":["Nothing is lost on expiry","If the hold does lapse, the form is kept and the user returns to the time step, not to the beginning. The sentence saying so appears only with the warning, and again when it actually expires."],
 "31":["The booking is visible while you type","Service, date, time, format and price stay on screen."],

   evento del flujo llega en la pagina de gracias, y llega con el correo
   dentro del parametro dl. */
const TRACE=[];
function track(name, params){
 const ev=Object.assign({event:name, booking_version:"annotated-prototype"}, params||{});
 (window.dataLayer=window.dataLayer||[]).push(ev);
 TRACE.push(ev); renderTrace();
}
function renderTrace(){
 const h=document.getElementById("traceHost"); if(!h)return;
 h.innerHTML=TRACE.length?`<div class="trace"><b>dataLayer · ${TRACE.length} event${TRACE.length>1?"s":""}</b>`+
   TRACE.map(e=>`<code>${JSON.stringify(e).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</code>`).join("")+
   `</div>`:"";
}

const SVC_MS=700, SVC_LIMITE=5000;
function cargarServicios(modo){
 clearTimeout(S.svcT); clearTimeout(S.svcD);
 S.svcLoad="loading"; draw(); say("Loading the services we offer");

                     :"Seven services available");}, SVC_MS);

/* ═══ Carga de horas disponibles ═══
   La peticion tiene un limite de vida PROPIO, no atado a que conteste. Ese es
   el punto: una peticion colgada no resuelve ni rechaza, asi que nunca llega a
   un .finally() y la linea que apaga el indicador no se ejecuta nunca. El
   limite es un temporizador aparte y se cumple pase lo que pase.
   5 segundos aqui para que el estado se pueda ver; en produccion son unos 15. */
const CARGA_MS=650, LIMITE_MS=5000;
function cargarHoras(modo){
 clearTimeout(S.loadT); clearTimeout(S.deadT);
 S.load="loading"; S.loadErr=null; draw();
 say("Checking which times are free");
 S.deadT=setTimeout(()=>{clearTimeout(S.loadT);
   S.load=null; S.loadErr="slow"; draw();
   say("This is taking longer than it should. You can try again or pick another day.");
 }, LIMITE_MS);
 if(modo==="cuelga")return;                       // la peticion que nunca contesta
 S.loadT=setTimeout(()=>{clearTimeout(S.deadT);
   S.load=null; S.loadErr=(modo==="error")?"fail":null; draw();
   say(modo==="error"?"We could not load the available times"
       :(S.date?avail(S.date).length+" times available":"Times loaded"));
 }, CARGA_MS);
}

 /* Un esqueleto de las doce horas, no un circulo girando: dice QUE viene y

  <p class="psub" style="margin-top:14px;font-size:12px">Checking which times are free.</p>`;

function claveHold(){return S.date&&S.slot?kk(S.date)+" "+S.slot:null}
function startHold(){
 clearInterval(S.tid);
 const k=claveHold();
 if(k!==S.heldFor||!S.holdUntil){S.heldFor=k;S.holdUntil=Date.now()+300000}
 /* El resto se calcula contra el reloj, no restando uno por repintado: asi el
    tiempo que pasa fuera del paso 4 cuenta, que es lo que de verdad ocurre con
    una reserva en el servidor. */
 const tic=()=>{
  const antes=S.hold;
  S.hold=Math.max(0,Math.round((S.holdUntil-Date.now())/1000));
  if(S.step!==4){clearInterval(S.tid);return}
  if(antes>60&&S.hold<=60)say("One minute left on this time. You can give yourself longer.");
  if(S.hold<=0){clearInterval(S.tid);S.heldFor=null;S.holdUntil=null;S.slot=null;S.step=3;
    say("That time was released. Your details are saved, choose another.");draw();return}
  /* solo se repinta la franja: repintar la vista entera destruiria el campo enfocado */
  document.getElementById("holdHost").innerHTML=holdStrip();
 };
 tic();
 if(S.step===4)S.tid=setInterval(tic,1000);
}

function read(){["first","last","dob","occupation","company","phone","email","notes","discount"].forEach(k=>{
  const e=document.getElementById(k);if(e)S.form[k]=e.value.trim()});
 S.form.terms=!!(document.getElementById("terms")||{}).checked}
/* Irlanda solamente, por decision del cliente (ver nota 37). Acepta movil y
   fijo, con 0 inicial o en forma internacional. En produccion esto deberia ser
   libphonenumber con region IE, no una expresion regular. */
function irishPhone(v){
 const d=String(v).replace(/\D/g,"");
 return /^353\d{7,9}$/.test(d) || /^0\d{7,9}$/.test(d);
}
/* DD/MM/YYYY estricto, como el pi()(e,"DD/MM/YYYY",!0) de produccion */
function ageFrom(v){
 const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(v).trim());
 if(!m)return null;
 const d=+m[1],mo=+m[2],y=+m[3], dt=new Date(y,mo-1,d);
 if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
 const now=new Date(); let a=now.getFullYear()-y;
 const before=(now.getMonth()<mo-1)||(now.getMonth()===mo-1&&now.getDate()<d);
 if(before)a--;
 return a;
}
/* Una regla por campo, para poder comprobar uno solo al salir de el.
   Las de la fecha y sus textos son los de produccion: 18 minimo, 104 maximo. */
function fieldError(k, f){
 const v = typeof f[k]==="string" ? f[k].trim() : "";   /* terms es booleano */
 switch(k){
  case "first":      return v?"":"Enter your first name.";
  case "last":       return v?"":"Enter your last name.";
  case "occupation": return v?"":"Enter your occupation.";
  case "notes":      return v?"":"Tell your adviser what you would like to cover.";
  case "dob":{
   if(sv().id==="ex") return "";
   if(!v) return "Enter your date of birth as DD/MM/YYYY.";
   const age=ageFrom(v);
   if(age===null) return "Enter a valid date of birth (DD/MM/YYYY).";
   if(age<18)  return "You must be 18 or over.";
   if(age>104) return "Check the year, that date looks too far back.";
   return "";
  }
  case "phone":
   if(!v) return "Enter a phone number so your adviser can reach you.";
   return irishPhone(v)?"":"Enter an Irish number, for example 087 123 4567, 01 234 5678 or +353 87 123 4567.";
  case "email":
   if(!v) return "Enter your email so we can send the joining link.";
   return /^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(v)?"":"That is not a complete email address. It needs an @ and a domain, like name@example.ie";
  case "terms":      return f.terms?"":"You need to accept this before we can book.";
 }
 return "";
}
const FIELDS=["first","last","dob","occupation","phone","email","notes","terms"];
function valid(){const e={},f=S.form;
 FIELDS.forEach(k=>{const m=fieldError(k,f); if(m)e[k]=m});
 S.errs=e;return !Object.keys(e).length}

/* Pinta o quita el error de un solo campo sin repintar la vista, que
   destruiria lo escrito y el foco que acaba de moverse al campo siguiente. */
function showFieldError(id, msg){
 const el=document.getElementById(id); if(!el)return;
 const box=el.closest(".f"); if(!box)return;
 const last=box.lastElementChild;
 if(last && (last.classList.contains("err")||last.classList.contains("hint"))) last.remove();
 if(msg){
  el.setAttribute("aria-invalid","true"); el.setAttribute("aria-describedby","e-"+id);
  const sp=document.createElement("span");
  sp.className="err"; sp.id="e-"+id; sp.setAttribute("role","alert");
  sp.textContent="\u26a0 "+msg; box.appendChild(sp);
 }else{
  el.removeAttribute("aria-invalid"); el.removeAttribute("aria-describedby");
  const h=HINTS[id];
  if(h){ const sp=document.createElement("span"); sp.className="hint"; sp.textContent=h; box.appendChild(sp); }
 }
 S.errs[id]=msg||undefined; if(!msg) delete S.errs[id];
}
const HINTS={phone:"Mobile or landline, for example 087 123 4567",
 email:"We send the joining link here.",
 notes:"Your adviser reads this before the call.",
 company:"Optional. If you are booking after a money masterclass at your workplace, tell us where you work so we can tailor the session."};

/* Al salir de un campo, y solo si se escribio algo: decirlo entonces y no al
   final. Un campo vacio se calla, porque puede que la persona vuelva a el.
   Una vez marcado, se revalida en cada tecla para que el aviso se vaya solo. */
document.addEventListener("focusout", e=>{
 const el=e.target;
 if(S.step!==4 || !el || !el.id || !FIELDS.includes(el.id)) return;
 read();
 const cur=S.form[el.id];
 if(typeof cur!=="string" || !cur.trim()) return;   /* vacio, o la casilla */
 showFieldError(el.id, fieldError(el.id, S.form));
});

/* ═══ Burbujas en sitio ═══ */
function closeBub(){document.querySelectorAll(".bub").forEach(b=>b.remove())}
function openBub(btn){closeBub();
 const d=N[btn.dataset.n];if(!d)return;
 const b=document.createElement("div");b.className="bub";
 b.setAttribute("role","dialog"); b.setAttribute("aria-modal","false");
 b.setAttribute("aria-label","Design note "+btn.dataset.n);
 b.innerHTML=`<button type="button" class="x" aria-label="Close">×</button><p class="bt">${d[0]}</p>
  <p>${d[1]}</p>`;
 document.body.appendChild(b);
 const r=btn.getBoundingClientRect(),W=b.offsetWidth,H=b.offsetHeight,VW=document.documentElement.clientWidth;
 let l,t;
 if(r.right+12+W<=VW-10){l=r.right+scrollX+12;t=r.top+scrollY-10}
 else if(r.bottom+12+H<=scrollY+document.documentElement.clientHeight+500){
   l=Math.min(Math.max(8,r.left+scrollX-18),scrollX+VW-W-10);t=r.bottom+scrollY+12;b.classList.add("below")}
 else{l=Math.max(8,r.left+scrollX-W-12);t=r.top+scrollY-10;b.classList.add("flip")}
 b.style.left=l+"px";b.style.top=t+"px";
 b.querySelector(".x").onclick=closeBub;
}

   draw();return}
  if(S.step===1){S.step=sv().id==="ex"?3:2;
   const p=S.step===3?preFecha():null;draw();
   if(p)say("Showing times for "+diLargo(p)+". Pick another day to change it.");
   track("booking_step",{step:2,name:"service_detail",service:sv().n});return}
  if(S.step===2&&S.income!==null){S.step=3;
   const p=preFecha();draw();
   if(p)say("Showing times for "+diLargo(p)+". Pick another day to change it.");
   track("booking_step",{step:3,name:"date_and_time",service:sv().n});return}
  if(S.step===3&&S.slot){S.step=4;S.errs={};draw();startHold();track("booking_step",{step:4,name:"your_details",service:sv().n});return}
 }
 if(t.id==="go"||t.closest("#go")){
  read();
  if(!valid()){draw();
   requestAnimationFrame(()=>{
     const f=document.querySelector('[aria-invalid="true"]')||document.getElementById("terms");
     if(f){f.focus({preventScroll:true});f.scrollIntoView({block:"center",behavior:"smooth"})}});
   say(Object.keys(S.errs).length+" things still need your attention");
   track("booking_validation_failed",{service:sv().n,fields:Object.keys(S.errs)});return}
  S.busy=true;draw();say("Confirming your appointment");
  setTimeout(()=>{clearInterval(S.tid);
   S.ref="AP-"+(sd(S.form.email+S.slot)%9000+1000)+"-"+String(S.date.getDate()).padStart(2,"0")+String(S.date.getMonth()+1).padStart(2,"0");
   S.busy=false;S.step=5;draw();say("Booked. Reference "+S.ref);
   /* La conversion. Sin correo, sin nombre: solo la referencia opaca. */
   track(sv().price?"begin_checkout":"booking_complete",
     {service:sv().n, booking_reference:S.ref, value:sv().price, currency:"EUR"})},1000);
  return}

 /* Fuera de if(a): estos botones llevan data-credit y NO data-act, asi que
    anidada aqui dentro la rama no se alcanzaba nunca y la pregunta no se
    podia responder. */
 const cr=t.closest("[data-credit]");
 if(cr){read();S.form.credit=cr.dataset.credit;draw();
   say("Credit issues: "+cr.dataset.credit);return}

 const a=t.closest("[data-act]");
 if(a){const k=a.dataset.act;
  if(k==="discount"){read();
    const c=(S.form.discount||"").trim().toUpperCase();
    S.disc = !c ? null
      : c==="ASKPAUL50" ? `Code applied. You will pay €${sv().price/2} today instead of €${sv().price}.`
      : `That code was not recognised. You will pay €${sv().price} today.`;
    say(S.disc); document.getElementById("d-msg").textContent=S.disc; return}
  if(k==="focusdemo"){
    const on=document.body.classList.toggle("focusdemo");
    a.textContent=on?"Focus ring: now visible on click too":"Preview the keyboard focus ring";
    if(on){const c=document.querySelector(".svc");if(c)c.focus()}
    say(on?"Focus ring now shown on every focused element":"Focus ring back to keyboard only");return}
  if(k==="svcfail"){cargarServicios("error");return}
  if(k==="svcretry"){cargarServicios("ok");return}
  if(k==="fail"){cargarHoras("error");return}
  if(k==="hang"){cargarHoras("cuelga");return}
  if(k==="otherday"){S.loadErr=null;S.date=null;S.slot=null;draw();say("Pick another day");return}
  else if(k==="extend"){read();S.holdUntil=Date.now()+300000;S.hold=300;say("Five more minutes.");
    /* solo la franja: un draw() completo borraria lo escrito y el foco,
       que es exactamente el defecto que este prototipo dice corregir */
    document.getElementById("holdHost").innerHTML=holdStrip();
    const back=lastField&&document.getElementById(lastField);
    if(back)back.focus();return}
  else if(k==="retry"){cargarHoras("ok");return}
  else if(k==="mail"){S.step=6;draw()}
  else if(k==="backdone"){S.step=5;draw()}
  else if(k==="resched"){const fromMg=S.step===7;S.step=3;S.slot=null;draw();
    say(fromMg?"Pick a new time. The appointment you have stays until you confirm the new one."
             :"Pick a new time. Your details are saved.")}
  else if(k==="manage"){
    /* Si se llega por el atajo sin haber reservado, se monta la cita de ejemplo

    if(!S.svc){S.svc="fp";S.date=new Date(MGSAMPLE.date);S.slot=MGSAMPLE.slot}
    S.step=7;S.mg.view="ok";draw();say("Appointment management page")}
  else if(k==="mgexit"){S.step=S.ref?5:0;draw()}
  else if(k==="mgv"){S.mg.view=t.closest("[data-v]").dataset.v;S.mg.busy=false;draw()}
  else if(k==="mgback"){S.mg.view="ok";draw()}

  else if(k==="mgcancel"){S.mg.view="form";draw();

    S.mg.view="ok";draw()}
  else if(k==="mgdo"){

    S.mg.busy=true;draw();

      track("appointment_cancelled",{service:mgAppt().n,reason_given:reason.length>0});
      say("Your appointment is cancelled")},900);}
  else if(k==="ics")alert("appointment.ics\n\nDTSTART;TZID=Europe/Dublin\nORGANIZER: a real mailbox\nJoin link inside the event (see note 58).");
  else if(k==="cancel"){S.step=7;S.mg.view="form";draw();
    const r=document.getElementById("mgreason");if(r)r.focus();
    say("Confirm the cancellation below")}
  return}
});
/* S.form se mantiene al dia con cada pulsacion. Sin esto, cualquier repintado
   (ampliar el hold, o que expire) devolveria campos vacios y la promesa de la
   nota 40 seria falsa en el propio prototipo. */
/* Mascara DD/MM/YYYY. La barra aparece en cuanto el par esta completo,
   no al teclear el digito siguiente como hace produccion. Se cuentan los
   digitos a la izquierda del cursor para recolocarlo: reformatear sin eso
   lo manda al final y hace imposible corregir en medio. */
/* Normaliza los digitos para que no pueda existir una fecha imposible.
   Dia: un primer digito de 4 a 9 no puede ser decena, asi que se convierte
   en dia de un solo digito (5 -> 05) y se pasa al mes. Un segundo digito
   que llevaria el par por encima de 31 se descarta. Mes igual con 12. */
let dobDropped=null;   /* que se rechazo en la ultima pulsacion, y por que */
function fixDOB(raw){
 let d="", i=0; dobDropped=null;
 if(i<raw.length){
  if(+raw[i]>3){ d+="0"+raw[i]; i++; }
  else { d+=raw[i]; i++;
    if(i<raw.length){ const pair=d+raw[i];
      if(pair!=="00" && +pair<=31) d+=raw[i];
      else dobDropped = pair==="00" ? "There is no day 00. The first day of a month is 01."
                                    : "There is no day "+pair+". Days run from 01 to 31.";
      i++; } }
 }
 if(d.length===2 && i<raw.length){
  if(+raw[i]>1){ d+="0"+raw[i]; i++; }
  else { d+=raw[i]; i++;
    if(i<raw.length){ const pair=d.slice(2)+raw[i];
      if(pair!=="00" && +pair<=12) d+=raw[i];
      else dobDropped = pair==="00" ? "There is no month 00. January is 01."
                                    : "There is no month "+pair+". Months run from 01 to 12.";
      i++; } }
 }
 /* El ano tambien: toda persona viva nacio en 19xx o 20xx. Eso es imposible,
    no una regla de negocio. Que sea demasiado antiguo o demasiado reciente lo
    sigue diciendo el validador, con los mensajes de produccion. */
 if(d.length===4){
  let acc="";
  for(const ch of raw.slice(i)){
   if(acc.length===0 && ch!=="1" && ch!=="2"){ dobDropped="A birth year starts with 19 or 20."; continue; }
   if(acc.length===1 && ch!==(acc==="1"?"9":"0")){ dobDropped="A birth year starts with 19 or 20."; continue; }
   acc+=ch; if(acc.length===4) break;
  }
  d+=acc;
 }
 return d.slice(0,8);
}
function maskDOB(el, deleting){
 const caret = el.selectionStart ?? el.value.length;
 const before = el.value.slice(0, caret).replace(/\D/g,"").length;
 /* Tambien al borrar: si no, quitar un digito en medio desplaza el resto
    y se recompone una fecha imposible que se salta la validacion. */
 const d = fixDOB(el.value.replace(/\D/g,"").slice(0,10));
 let out = d.slice(0,2);
 if(d.length>=2) out += (d.length>2 || !deleting) ? "/" : "";
 out += d.slice(2,4);
 if(d.length>=4) out += (d.length>4 || !deleting) ? "/" : "";
 out += d.slice(4,8);
 /* Si el cursor estaba al final, ahi se queda. Contar digitos no sirve cuando
    fixDOB ha insertado un cero delante: el cursor caeria entre el cero y el
    digito tecleado, y la siguiente tecla entraria en medio. */
 const atEnd = caret >= el.value.length;
 if(out!==el.value) el.value = out;
 let pos;
 if(atEnd) pos = out.length;
 else{
  pos=0; let seen=0;
  while(pos<out.length && seen<before){ if(/\d/.test(out[pos])) seen++; pos++; }
  while(pos<out.length && out[pos]==="/") pos++;
 }
 try{ el.setSelectionRange(pos,pos); }catch(e){}
 const g=document.getElementById("dobGhost"); if(g) g.innerHTML=ghostFor(out);
 /* Una tecla que no entra sin explicacion se lee como campo roto. El aviso
    no va en rojo: no hay nada que corregir, el digito imposible nunca entro. */
 const n=document.getElementById("dobNote");
 if(n){ n.textContent = dobDropped || ""; n.hidden = !dobDropped;
        if(dobDropped) say(dobDropped); }
}
document.addEventListener("input",e=>{
 const t=e.target;
 if(t && t.id==="dob") maskDOB(t, /^delete/.test(e.inputType||""));
 if(S.step===4){ read();
  if(t && t.id && S.errs[t.id]) showFieldError(t.id, fieldError(t.id, S.form)); }
});
/* Se recuerda el ultimo campo enfocado. Al ampliar, el boton desaparece del DOM
   y el foco caeria a BODY: se devuelve a donde estaba escribiendo la persona. */
let lastField=null;
document.addEventListener("focusin",e=>{const t=e.target;
 if(t&&t.closest&&t.closest(".frm")&&t.id)lastField=t.id});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeBub()});
document.getElementById("fab").onclick=e=>{
 const off=document.body.classList.toggle("clean");
 e.target.setAttribute("aria-pressed",String(!off));
 e.target.textContent="Notes: "+(off?"off":"on");if(off)closeBub()};
addEventListener("resize",closeBub);
/* ═══ Vista escritorio / movil ═══
   Iframe y no un div estrecho: ver el comentario del CSS. Por defecto
   escritorio, y el iframe no se carga hasta que se pide movil. */
/* La vista movil se monta con srcdoc, reconstruyendo el documento desde el DOM
   vivo. Se probo antes con src="?view=frame": funciona, pero el iframe emite un
   load de su about:blank inicial, asi que cualquier comprobacion posterior
   llega antes que el documento real. srcdoc no pide nada a la red, se comporta
   igual en file:// que publicado y ahorra una segunda descarga de 175 KB.
   La clase framed se inyecta en el clon porque dentro no hay query que leer. */
const montar=fr=>{
 const d=document.documentElement.cloneNode(true),bd=d.querySelector("body");
 bd.classList.add("framed");bd.classList.remove("mobmode","clean");
 fr.srcdoc="<!doctype html>"+d.outerHTML;
};
/* Si la ventana no da los 844, se encoge el marco entero en vez de recortarlo.
   El margen negativo devuelve el hueco que el elemento sin escalar sigue
   ocupando en el flujo, para que el pie no quede flotando. */
const ALTO=868;   // 844 de pantalla + 12+12 del bisel
const escalar=()=>{
 const ph=document.querySelector(".phone"),et=document.getElementById("phzoom");
 if(!ph)return;
 const k=innerWidth<=520?1:Math.min(1,(innerHeight-150)/ALTO);
 ph.style.transform=k<1?"scale("+k.toFixed(4)+")":"";
 ph.style.marginBottom=k<1?Math.round(ALTO*(k-1))+"px":"";
 if(et)et.textContent=k<1?" Shown here at "+Math.round(k*100)+"% of actual size.":"";
};
addEventListener("resize",escalar);
cargarServicios("ok");
(()=>{
 const tabs=[...document.querySelectorAll(".vt")],fr=document.getElementById("phscr");
 const pick=v=>{
  tabs.forEach(t=>{const on=t.dataset.view===v;
   t.setAttribute("aria-checked",String(on));t.tabIndex=on?0:-1});
  document.body.classList.toggle("mobmode",v==="mobile");
  if(v==="mobile"&&!fr.dataset.on){fr.dataset.on="1";montar(fr)}
  if(v==="mobile")escalar();
  closeBub();
  say(v==="mobile"?"Mobile preview, 390 pixels wide":"Desktop preview");
 };
 tabs.forEach((t,i)=>{
  t.onclick=()=>pick(t.dataset.view);
  t.onkeydown=e=>{
   if(!/^Arrow(Left|Right|Up|Down)$/.test(e.key))return;
   e.preventDefault();
   const n=tabs[(i+(/Right|Down/.test(e.key)?1:tabs.length-1))%tabs.length];
   n.focus();pick(n.dataset.view)};
 });
})();
draw();
