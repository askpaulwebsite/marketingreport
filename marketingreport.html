    <!-- Privacy guard: ask every well-behaved crawler to skip the file.
         `noindex` keeps the page out of search results, `nofollow` stops
         link-graph propagation, `noarchive` blocks Google's cached copy,
         `nosnippet` suppresses preview text. Bots that ignore robots

    <script>
      // Apply the saved theme BEFORE React mounts to avoid a colour flash.
      // Default is 'dark' (night mode); only 'light' is an opt-in.
      (function () {
        try {
          var saved = localStorage.getItem('ap-theme');
          document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
